            width: 100%;
        }

        .app-switcher {
            display: flex;
            gap: 8px;
            padding: 6px;
            background: #fff;
            border: 1px solid #e8e4df;
            border-radius: 999px;
            margin: 0 auto 28px;
            width: fit-content;
            max-width: 100%;
            overflow-x: auto;
        }

        .app-tab {
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: #6b6560;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 16px;
            transition: background 0.2s ease, color 0.2s ease;
            white-space: nowrap;
        }

        .app-tab.active {
            background: #7c6dab;
            color: #fff;
        }

        .app-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            border: 1px solid #e8e4df;
            border-radius: 40px;
            padding: 6px 16px 6px 6px;
            margin-bottom: 32px;
            font-size: 14px;
            color: #6b6560;
        }

        .app-badge .icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #7c6dab, #a78bba);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .app-badge .icon.intende-icon {
            position: relative;
            background: linear-gradient(135deg, #7c6dab, #a78bba);
            border-radius: 50%;
            font-size: 0;
        }

        .app-badge .icon.intende-icon::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 6px;
            width: 4px;
            height: 11px;
            border-radius: 999px;
            background: #1b1f1b;
            transform: translateX(-50%);
        }

        .app-badge .icon.intende-icon::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 5px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #47664a;
            transform: translateX(-50%);
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .dates {
            font-size: 14px;
            color: #7a756f;
            margin-bottom: 12px;
        }

        .intro {
            font-size: 16px;
            color: #7a756f;

            margin-bottom: 16px;

            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .section p {
            font-size: 15px;
            color: #4a4a4a;
            margin-bottom: 12px;
        }

            margin-bottom: 0;
        }

        .section a {
            color: #7c6dab;
            font-weight: 500;
            text-decoration: none;
        }

        .section a:hover {
            text-decoration: underline;
        }

        .section ul {
            list-style: none;
            padding: 0;
            margin: 8px 0 12px;
        }

        .section ul li {
            font-size: 15px;
            color: #4a4a4a;
            padding: 4px 0 4px 20px;
            position: relative;
        }

        .section ul li::before {
            content: "•";
            position: absolute;
            left: 4px;
            color: #7c6dab;
            font-weight: 600;
        }

        .contact-box {

            color: #7a756f;
            font-size: 14px;
        }

        .contact-box a {
            color: #7c6dab;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-box a:hover {
            text-decoration: underline;

            color: #7c6dab;

                font-size: 29px;

        const tabs = document.querySelectorAll('.app-tab');
        const appIcon = document.getElementById('appIcon');
        const appName = document.getElementById('appName');
        const dates = document.getElementById('dates');
        const intro = document.getElementById('intro');
        const sections = document.getElementById('sections');
        const emailLink = document.getElementById('emailLink');
        const footer = document.getElementById('footer');
        const termsLink = document.getElementById('termsLink');
        const deleteDataLink = document.getElementById('deleteDataLink');
        const pageLinks = document.getElementById('pageLinks');

        function sectionTemplate(section) {
            const listHtml = section.list
                ? `<ul>${section.list.map(item => `<li>${item}</li>`).join('')}</ul>`
                : '';

            const listAfter = Number.isInteger(section.listAfter)
                ? section.listAfter
                : section.paragraphs.length;

            const content = section.paragraphs
                .map((paragraph, index) => {
                    const paragraphHtml = `<p>${paragraph}</p>`;
                    return index + 1 === listAfter ? paragraphHtml + listHtml : paragraphHtml;
                })
                .join('');

            return `
                <div class="section">
                    <h2>${section.title}</h2>
                    ${content}
                </div>
            `;
        }

        function setApp(appKey, updateUrl = true) {
            const policy = policies[appKey] || policies.hushaby;

            document.title = policy.title;
            appIcon.classList.toggle('intende-icon', appKey === 'intende');
            appIcon.textContent = policy.icon;
            appName.textContent = policy.appName;
            dates.textContent = policy.dates;
            intro.textContent = policy.intro;
            sections.innerHTML = policy.sections.map(sectionTemplate).join('');
            emailLink.href = `mailto:${policy.email}`;
            emailLink.textContent = policy.email;
            footer.textContent = policy.footer;

            termsLink.href = `./terms-of-use.html?app=${appKey}`;
            deleteDataLink.href = `./delete-data.html?app=${appKey}`;
            pageLinks.style.display = policy.showUtilityLinks === false ? 'none' : 'flex';

            tabs.forEach(tab => {
                const isActive = tab.dataset.app === appKey;
                tab.classList.toggle('active', isActive);
                tab.setAttribute('aria-selected', String(isActive));
            });

            if (updateUrl) {
                const url = new URL(window.location.href);
                url.searchParams.set('app', appKey);
                window.history.replaceState({}, '', url);
            }
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => setApp(tab.dataset.app));
        });

        const params = new URLSearchParams(window.location.search);
        const requestedApp = params.get('app');
        const initialApp = Object.prototype.hasOwnProperty.call(policies, requestedApp)
            ? requestedApp
            : 'hushaby';
        setApp(initialApp, false);
    </script>
